<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BzsJ</title><link rel="stylesheet" href="style.css?v=36-minimal"><link rel="stylesheet" href="../effect-switch.css"><link rel="icon" type="image/svg+xml" href="../logos/flame.svg"><link rel="stylesheet" href="../studio-ui.css"><script>window.studioSleeping=new URLSearchParams(location.search).has("prewarm");</script></head><body>
<header><details class="effect-switch"><summary aria-label="切换动画效果"><img class="effect-logo" src="../logos/flame.svg" alt=""><span class="effect-title">焰字</span><span class="effect-subtitle">FLAME STUDIO</span><span class="effect-chevron">⌄</span></summary><nav aria-label="选择动画效果"><a href="../flame/" aria-current="page">焰字<span>火焰文字</span></a><a href="../burn/">焚字<span>文字烧蚀</span></a></nav></details></header>
<main><section class="stage"><canvas id="view" aria-label="火焰文字动画"></canvas><div id="error" hidden></div></section></main>
<div class="controls"><p class="status"><span id="state">正在显现</span><span id="clock">0.0 / 7.0s</span></p><div class="dock"><label class="text-field"><span class="sr-only">文字内容</span><input id="text" type="text" maxlength="32" value="BzsJ" placeholder="输入文字" autocomplete="off"></label><span id="char-count" class="sr-only">5 / 32</span><div class="color-field"><label for="color">火焰</label><input type="color" id="color" value="#ff1717" aria-label="火焰颜色"><span id="hex-value" class="sr-only">#1768FF</span></div><div class="color-field"><label for="ink">文字</label><input type="color" id="ink" value="#ffffff" aria-label="文字颜色"></div><div class="color-field"><label for="background">背景</label><input type="color" id="background" value="#000000" aria-label="背景颜色"></div><span class="separator"></span><button id="restart" aria-label="重新播放" title="重新播放">↺</button><button id="play" aria-label="播放或暂停" title="播放或暂停">Ⅱ</button><details class="settings"><summary aria-label="打开设置" title="设置">☷</summary><div class="settings-panel"><div class="panel-title">设置<button id="close-settings" aria-label="关闭设置">×</button></div><label for="font">字体</label><select id="font"><option value="Reference">西部窄粗体</option><option value="Sancreek">西部装饰体</option><option value="Rye" selected>复古衬线</option><option value="Smokum">修长装饰体</option><option value="serif">经典衬线</option><option value="sans-serif">现代黑体</option><option value="KaiTi">中文楷体</option></select><label for="duration">动画时长</label><select id="duration"><option value="7">7 秒</option><option value="10">10 秒</option><option value="14">14 秒</option></select><label class="check"><input id="loop" type="checkbox" checked>循环播放</label><label class="slider-label">字号 <output id="scale-value">100%</output><input id="scale" type="range" min=".55" max="1.15" step=".01" value="1"></label><label class="slider-label">火焰高度 <output id="height-value">100%</output><input id="height" type="range" min=".45" max="1.6" step=".01" value="1"></label><label class="slider-label">辉光 <output id="glow-value">75%</output><input id="glow" type="range" min=".2" max="1.5" step=".01" value=".75"></label><button id="replay">重新点燃</button></div></details></div><button id="downloadFlame" class="download-flame" title="最高 4K · 60 Mbps · MP4">下载高清 <span>↓</span></button><input id="seek" aria-label="动画进度" type="range" min="0" max="7" step=".01" value="0"></div>
<script src="reference-glyphs.js"></script><script src="app-v2.js?v=36-background-color"></script><script src="ui.js?v=35"></script><script src="../effect-switch.js"></script><p id="exportStatus" class="export-status" role="status" hidden></p><script src="../mp4-muxer.js"></script><script src="download.js"></script><script src="../studio-ui.js"></script></body></html>
