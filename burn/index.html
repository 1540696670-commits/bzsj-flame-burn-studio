<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010"><title>BzsJ</title><meta name="description" content="输入文字，选择字体与颜色，观看五秒烧蚀动画。"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../effect-switch.css"><link rel="icon" type="image/svg+xml" href="../logos/burn.svg"><link rel="stylesheet" href="../studio-ui.css"><script>window.studioSleeping=new URLSearchParams(location.search).has("prewarm");</script></head>
<body>
<div id="background"></div><canvas id="stage" aria-label="文字烧蚀动画预览"></canvas>
<header><details class="effect-switch"><summary aria-label="切换动画效果"><img class="effect-logo" src="../logos/burn.svg" alt=""><span class="effect-title">焚字</span><span class="effect-subtitle">BURN STUDIO</span><span class="effect-chevron">⌄</span></summary><nav aria-label="选择动画效果"><a href="../flame/">焰字<span>火焰文字</span></a><a href="../burn/" aria-current="page">焚字<span>文字烧蚀</span></a></nav></details><span class="header-note">让文字，慢慢燃尽。</span></header>
<button id="centerPlay" class="center-play" aria-label="播放动画"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
<main class="workspace" aria-label="动画编辑器">
<section class="panel" id="textPanel" hidden><div class="panel-heading"><h2>写下你的文字</h2><button class="close" aria-label="关闭">×</button></div><label for="mainText">主文字</label><input id="mainText" value="BzsJ" maxlength="32" autocomplete="off" spellcheck="false"><label for="subText">副文字 <span>可留空</span></label><input id="subText" value="BURN STUDIO" maxlength="40" autocomplete="off" spellcheck="false"><div class="range-label"><label for="size">文字大小</label><output id="sizeLabel">100%</output></div><input type="range" id="size" min="50" max="140" value="100"></section>
<section class="panel" id="fontPanel" hidden><div class="panel-heading"><h2>选择字体</h2><button class="close" aria-label="关闭">×</button></div><div class="font-grid" id="fontGrid"></div><label class="upload" for="fontFile">＋ 导入字体 <span>TTF / OTF / WOFF</span></label><input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2" hidden></section>
<section class="panel" id="colorPanel" hidden><div class="panel-heading"><h2>颜色与背景</h2><button class="close" aria-label="关闭">×</button></div><label class="color-row" for="ink"><span>文字颜色</span><span class="color-value" id="inkValue">#F6D745</span><input type="color" id="ink" value="#f6d745"></label><label class="color-row" for="ember"><span>余烬颜色</span><span class="color-value" id="emberValue">#FF8040</span><input type="color" id="ember" value="#ff8040"></label><label class="color-row" for="bg"><span>背景颜色</span><span class="color-value" id="bgValue">#101010</span><input type="color" id="bg" value="#101010"></label><label class="upload" for="bgFile">＋ 背景图片 <span>JPG / PNG / WEBP</span></label><input type="file" id="bgFile" accept="image/*" hidden><button id="removeBg" class="text-button" hidden>移除背景图片</button></section>
<div class="playback"><span id="time">0.0 / 5.0 s</span><input id="timeline" type="range" min="0" max="5" step="0.01" value="0" aria-label="动画进度"><span class="duration" title="每5秒循环一次">循环</span></div>
<nav class="dock" aria-label="动画工具栏"><div class="presets" aria-label="配色预设"><button class="swatch" data-preset="classic" aria-label="蓝 × 橙" title="蓝 × 橙" style="--swatch:#173bce;--accent:#ffb64b"></button><button class="swatch" data-preset="paper" aria-label="红 × 青" title="红 × 青" style="--swatch:#d72638;--accent:#8de2dd"></button><button class="swatch" data-preset="rose" aria-label="紫 × 青柠" title="紫 × 青柠" style="--swatch:#6332a4;--accent:#d9f45a"></button><button class="swatch active" data-preset="blue" aria-label="黑 × 黄" title="黑 × 黄" style="--swatch:#101010;--accent:#f6d745"></button></div><span class="divider"></span><button id="textToggle" data-panel="textPanel" class="tool" aria-label="编辑文字" title="编辑文字"><span class="text-icon">T</span></button><button id="fontToggle" data-panel="fontPanel" class="tool" aria-label="选择字体" title="选择字体"><span class="font-icon">Aa</span></button><button id="colorToggle" data-panel="colorPanel" class="tool" aria-label="颜色与背景" title="颜色与背景"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg></button><span class="divider"></span><button id="snapshot" class="tool" aria-label="保存当前画面" title="保存当前画面"><svg viewBox="0 0 24 24"><path d="M4 7h4l2-2h4l2 2h4v12H4z"/><circle cx="12" cy="13" r="3"/></svg></button><button id="restart" class="tool" aria-label="重播" title="重播"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg></button><button id="play" class="tool play-tool" aria-label="播放" title="播放"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></svg></button></nav>
<p class="hint" id="hint">输入文字 · 挑选颜色 · 点一下，燃尽</p>
</main><div id="toast" role="status" aria-live="polite"></div><div id="error" hidden role="alert"></div><script src="app.js"></script><script src="../effect-switch.js"></script><script src="../studio-ui.js"></script><script src="../mp4-muxer.js"></script><script src="download.js"></script></body></html>
